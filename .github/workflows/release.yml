name: Release

# Runs on a version tag and publishes .deb, .AppImage, Windows installer +
# portable zip, and a macOS .dmg to a GitHub Release.
#
#     git tag -a v1.2.3 -m "1.2.3" && git push origin v1.2.3
#
# Every job needs fetch-depth: 0 — the .pro derives its version from
# `git describe`, which fails on the shallow clone actions/checkout defaults to.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v)'
        required: true
      only:
        description: 'Build just one artifact (to retry a single failed job). Nothing is published unless this is "all".'
        required: false
        default: all
        type: choice
        options:
          - all
          - deb
          - rpm
          - appimage
          - windows
          - macos

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  deb:
    name: Debian package
    needs: version
    if: >-
      ${{ github.event_name != 'workflow_dispatch'
          || inputs.only == 'all' || inputs.only == 'deb' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper \
            qt6-base-dev qt6-base-dev-tools qt6-5compat-dev libboost-program-options-dev

      # The committed <releases> entry would otherwise advertise the previous
      # version forever. Replaced with a bare version/date entry: release prose
      # cannot be generated from a tag, and a wrong description is worse than
      # none. Only the two Linux jobs install the metainfo.
      - name: Stamp the AppStream release entry
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import os, re, datetime
          version = os.environ['VERSION']
          today = datetime.date.today().isoformat()
          block = ('  <releases>\n'
                   '    <release version="%s" date="%s"/>\n'
                   '  </releases>' % (version, today))
          path = 'neoglogg.metainfo.xml'
          text = open(path).read()
          text, n = re.subn(r'  <releases>.*?</releases>', block, text, flags=re.S)
          assert n == 1, 'no <releases> block found'
          open(path, 'w').write(text)
          print(block)
          PYEOF

      # Written directly rather than with dch: the changelog is committed, so
      # dch --create refuses to overwrite it, and dch also wants
      # libdistro-info-perl just to validate the distribution name.
      - name: Stamp the changelog with the release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > debian/changelog <<EOF
          neoglogg ($VERSION) unstable; urgency=medium

            * Release $VERSION.

           -- Daniel Duris <dusoft@staznosti.sk>  $(date -R)
          EOF
          cat debian/changelog

      - name: Build the package
        run: dpkg-buildpackage -b -us -uc

      - name: Collect
        run: mkdir -p out && mv ../*.deb out/

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: out/*.deb

  rpm:
    name: RPM package
    needs: version
    if: >-
      ${{ github.event_name != 'workflow_dispatch'
          || inputs.only == 'all' || inputs.only == 'rpm' }}
    runs-on: ubuntu-latest
    # Built inside Fedora rather than on the Ubuntu runner: rpmbuild needs
    # the RPM macros and the Qt 6 packages under their Fedora names. The
    # result installs on Fedora/RHEL/openSUSE with dnf, yum or zypper.
    container: fedora:40
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install \
            rpm-build rpmdevtools git-core tar \
            gcc-c++ make qt6-qtbase-devel qt6-qt5compat-devel boost-devel \
            desktop-file-utils libappstream-glib

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The checkout is owned by a different user than the one rpmbuild runs
      # as inside the container, which git refuses to work with.
      - name: Mark the checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Same reasoning as the deb job: the committed <releases> entry would
      # otherwise advertise the previous version forever.
      - name: Stamp the AppStream release entry
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import os, re, datetime
          version = os.environ['VERSION']
          today = datetime.date.today().isoformat()
          block = ('  <releases>\n'
                   '    <release version="%s" date="%s"/>\n'
                   '  </releases>' % (version, today))
          path = 'neoglogg.metainfo.xml'
          text = open(path).read()
          text, n = re.subn(r'  <releases>.*?</releases>', block, text, flags=re.S)
          assert n == 1, 'no <releases> block found'
          open(path, 'w').write(text)
          print(block)
          PYEOF

      # rpmbuild builds from a tarball, so roll one whose top directory is
      # name-version, as %autosetup expects.
      - name: Create the source tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          rpmdev-setuptree
          tar --exclude-vcs \
              --transform "s,^\.,neoglogg-${VERSION}," \
              -czf ~/rpmbuild/SOURCES/neoglogg-${VERSION}.tar.gz .

      - name: Build the package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: rpmbuild -bb --define "version ${VERSION}" neoglogg.spec

      - name: Collect
        run: |
          mkdir -p out
          find ~/rpmbuild/RPMS -name '*.rpm' -exec mv {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: out/*.rpm

  appimage:
    name: AppImage
    needs: version
    if: >-
      ${{ github.event_name != 'workflow_dispatch'
          || inputs.only == 'all' || inputs.only == 'appimage' }}
    # 24.04, not an older image: Qt 6's 5compat module (required for the
    # legacy text codecs) is not packaged before then. The trade-off is the
    # glibc floor -- an AppImage bundles Qt but still links the host glibc,
    # which is not forward compatible, so this will not run on distributions
    # older than 24.04. Dropping to 22.04 means installing Qt via aqtinstall
    # instead of apt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools qt6-5compat-dev libboost-program-options-dev \
            libfuse2 wget file

      # The committed <releases> entry would otherwise advertise the previous
      # version forever. Replaced with a bare version/date entry: release prose
      # cannot be generated from a tag, and a wrong description is worse than
      # none. Only the two Linux jobs install the metainfo.
      - name: Stamp the AppStream release entry
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import os, re, datetime
          version = os.environ['VERSION']
          today = datetime.date.today().isoformat()
          block = ('  <releases>\n'
                   '    <release version="%s" date="%s"/>\n'
                   '  </releases>' % (version, today))
          path = 'neoglogg.metainfo.xml'
          text = open(path).read()
          text, n = re.subn(r'  <releases>.*?</releases>', block, text, flags=re.S)
          assert n == 1, 'no <releases> block found'
          open(path, 'w').write(text)
          print(block)
          PYEOF

      - name: Build the AppImage
        run: VERSION="${{ needs.version.outputs.version }}" ./release-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: '*.AppImage'

  windows:
    name: Windows installer
    needs: version
    if: >-
      ${{ github.event_name != 'workflow_dispatch'
          || inputs.only == 'all' || inputs.only == 'windows' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-nsis
            git zip

      - name: Build
        run: |
          qmake6 neoglogg.pro CONFIG+="release no-dbus" \
            VERSION="${{ needs.version.outputs.version }}"
          mingw32-make -j"$(nproc)"

      - name: Bundle the Qt runtime beside the binary
        run: windeployqt6 --release --no-translations release/neoglogg.exe

      - name: Portable zip
        run: |
          cd release
          zip -r "../neoglogg-${{ needs.version.outputs.version }}-win64.zip" .

      - name: Installer
        run: |
          makensis -DVERSION="${{ needs.version.outputs.version }}" neoglogg.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            *.exe
            *.zip

  macos:
    name: macOS disk image
    needs: version
    if: >-
      ${{ github.event_name != 'workflow_dispatch'
          || inputs.only == 'all' || inputs.only == 'macos' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: qt5compat

      - name: Fetch Boost sources
        run: |
          curl -sL -o boost.tar.gz \
            https://archives.boost.io/release/1.83.0/source/boost_1_83_0.tar.gz
          tar xzf boost.tar.gz

      - name: Build
        run: |
          qmake neoglogg.pro BOOST_PATH="$PWD/boost_1_83_0" \
            CONFIG+="release no-dbus" \
            VERSION="${{ needs.version.outputs.version }}"
          make -j"$(sysctl -n hw.ncpu)"

      # macdeployqt writes the .dmg itself, which avoids the node/appdmg
      # dependency release-osx.sh needs. The disk image is unsigned: without
      # an Apple Developer ID, Gatekeeper will warn on first launch and users
      # must right-click > Open.
      - name: Bundle and package
        run: |
          macdeployqt release/neoglogg.app -dmg
          mv release/neoglogg.dmg \
             "neoglogg-${{ needs.version.outputs.version }}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: '*.dmg'

  aur:
    name: AUR package
    needs: [ version, publish ]
    runs-on: ubuntu-latest
    # Only on a real tag: the AUR package points at the tag's source tarball,
    # which a workflow_dispatch run has not created.
    if: startsWith(github.ref, 'refs/tags/v')
    # Needs the AUR_SSH_KEY secret (a private key whose public half is
    # registered on the AUR account). Without it the job is skipped rather
    # than failing the release.
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no AUR key is configured
        id: gate
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "No AUR_SSH_KEY secret set, skipping the AUR update."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp the PKGBUILD with the version and checksum
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd packaging/aur
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          # Checksum the tarball GitHub generated for the tag
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
          curl -sL --retry 5 --retry-delay 5 -o src.tar.gz "$url"
          sum=$(sha256sum src.tar.gz | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=('${sum}')/" PKGBUILD
          rm -f src.tar.gz
          cat PKGBUILD

      # makepkg refuses to run as root, so .SRCINFO is generated in the
      # official Arch container as a normal user.
      - name: Generate .SRCINFO
        if: steps.gate.outputs.enabled == 'true'
        run: |
          docker run --rm -v "$PWD/packaging/aur:/pkg" archlinux:base-devel bash -c '
            pacman -Sy --noconfirm >/dev/null
            useradd -m builder
            cp /pkg/PKGBUILD /home/builder/
            chown -R builder /home/builder
            su builder -c "cd /home/builder && makepkg --printsrcinfo" > /pkg/.SRCINFO
          '
          cat packaging/aur/.SRCINFO

      - name: Push to the AUR
        if: steps.gate.outputs.enabled == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur"

          git clone ssh://aur@aur.archlinux.org/neoglogg.git aur-repo
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "Daniel Duris"
          git config user.email "dusoft@staznosti.sk"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${VERSION}" || {
            echo "Nothing to commit."; exit 0; }
          git push

  publish:
    name: Publish release
    # A single-artifact run skips the other build jobs, which skips this one
    # too: the draft release is only ever assembled from a complete set. Use
    # the run's artifacts to check a one-off build.
    needs: [ version, deb, rpm, appimage, windows, macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what will be published
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          name: neoglogg ${{ needs.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
