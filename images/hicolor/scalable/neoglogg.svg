<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>neoglogg</title>
  <defs>
    <clipPath id="lens">
      <circle cx="195" cy="360" r="78"/>
    </clipPath>
  </defs>

  <!-- stacked documents -->
  <g stroke="#9AA0A6" stroke-width="5">
    <rect x="66" y="40" width="270" height="342" rx="14" fill="#F1F3F4"/>
    <rect x="96" y="64" width="270" height="342" rx="14" fill="#F1F3F4"/>
    <rect x="126" y="88" width="270" height="342" rx="14" fill="#FFFFFF"/>
  </g>

  <!-- four log lines -->
  <g>
    <rect x="160" y="112" width="205" height="26" rx="13" fill="#5F6368"/>
    <rect x="160" y="156" width="150" height="26" rx="13" fill="#EA4335"/>
    <rect x="160" y="200" width="205" height="26" rx="13" fill="#5F6368"/>
    <rect x="160" y="244" width="175" height="26" rx="13" fill="#1A73E8"/>
  </g>

  <!-- magnifier: handle lower-left, lens upper-right -->
  <line x1="140" y1="415" x2="70" y2="485" stroke="#3C4043" stroke-width="30" stroke-linecap="round"/>

  <circle cx="195" cy="360" r="78" fill="#FFFFFF"/>
  <g clip-path="url(#lens)">
    <rect x="110" y="306" width="170" height="32" rx="16" fill="#5F6368"/>
    <rect x="110" y="348" width="135" height="32" rx="16" fill="#34A853"/>
    <rect x="110" y="390" width="170" height="32" rx="16" fill="#5F6368"/>
  </g>
  <circle cx="195" cy="360" r="78" fill="#1A73E8" opacity="0.12"/>
  <circle cx="195" cy="360" r="78" fill="none" stroke="#1A73E8" stroke-width="22"/>
</svg>
