<?xml version="1.0" encoding="UTF-8"?>
<!-- Background for the macOS .dmg window.

     The drop positions come from osx_installer.json: the app lands at
     (150, 234) and the Applications alias at (415, 234), both 128px. Nothing
     here may sit under those, so the arrow lives in the gap between them and
     the wordmark stays up top.

     Colours are the app icon's own: #EA4335, #1A73E8, #34A853 over #3C4043. -->
<svg xmlns="http://www.w3.org/2000/svg" width="550" height="352" viewBox="0 0 550 352">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EAED"/>
    </linearGradient>
    <clipPath id="dmgLens">
      <circle cx="195" cy="360" r="78"/>
    </clipPath>
  </defs>

  <rect width="550" height="352" fill="url(#paper)"/>

  <!-- the application icon, inlined at 64px -->
  <g transform="translate(40,26) scale(0.125)">
    <g stroke="#9AA0A6" stroke-width="5">
      <rect x="66" y="40" width="270" height="342" rx="14" fill="#F1F3F4"/>
      <rect x="96" y="64" width="270" height="342" rx="14" fill="#F1F3F4"/>
      <rect x="126" y="88" width="270" height="342" rx="14" fill="#FFFFFF"/>
    </g>
    <rect x="160" y="112" width="205" height="26" rx="13" fill="#5F6368"/>
    <rect x="160" y="156" width="150" height="26" rx="13" fill="#EA4335"/>
    <rect x="160" y="200" width="205" height="26" rx="13" fill="#5F6368"/>
    <rect x="160" y="244" width="175" height="26" rx="13" fill="#1A73E8"/>
    <line x1="140" y1="415" x2="70" y2="485" stroke="#3C4043" stroke-width="30" stroke-linecap="round"/>
    <circle cx="195" cy="360" r="78" fill="#FFFFFF"/>
    <g clip-path="url(#dmgLens)">
      <rect x="110" y="306" width="170" height="32" rx="16" fill="#5F6368"/>
      <rect x="110" y="348" width="135" height="32" rx="16" fill="#34A853"/>
      <rect x="110" y="390" width="170" height="32" rx="16" fill="#5F6368"/>
    </g>
    <circle cx="195" cy="360" r="78" fill="#1A73E8" opacity="0.12"/>
    <circle cx="195" cy="360" r="78" fill="none" stroke="#1A73E8" stroke-width="22"/>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif">
    <text x="120" y="60" font-size="32" font-weight="600" fill="#3C4043">neoglogg</text>
    <text x="120" y="84" font-size="13" fill="#5F6368">The fast, smart log explorer. Updated and upgraded.</text>
    <text x="275" y="322" font-size="13" fill="#80868B" text-anchor="middle">Drag neoglogg into your Applications folder</text>
  </g>

  <!-- the icon's log lines, echoed as a rule under the wordmark -->
  <g>
    <rect x="120" y="98" width="64" height="5" rx="2.5" fill="#5F6368"/>
    <rect x="190" y="98" width="38" height="5" rx="2.5" fill="#EA4335"/>
    <rect x="234" y="98" width="52" height="5" rx="2.5" fill="#1A73E8"/>
    <rect x="292" y="98" width="26" height="5" rx="2.5" fill="#34A853"/>
  </g>

  <!-- arrow in the gap between the two 128px icons -->
  <g fill="none" stroke="#1A73E8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M243 234h72"/>
    <path d="M299 217l17 17-17 17"/>
  </g>
</svg>
