version: '{build}'

os: Visual Studio 2022

environment:
  matrix:
  - QT6: C:\Qt\6.5\mingw_64
    BOOST_ROOT: C:\Libraries\boost_1_83_0
    MINGW: C:\Qt\Tools\mingw1120_64
    MAKE_CMD: mingw32-make

matrix:
  fast_finish: true

before_build:
- set PATH=%MINGW%\bin;%QT6%\bin;%PATH%

build_script:
- qmake -v
- qmake -r BOOST_PATH=%BOOST_ROOT%
- call %MAKE_CMD%
